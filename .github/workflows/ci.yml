name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Verify synchronized application version
        run: node scripts/check-version-sync.mjs

      - name: Verify Pages artifact
        run: |
          node scripts/prepare-site.mjs _site
          test -s _site/assets/forest-background.jpg
          test -s _site/scripts/app-config.js
          test -s _site/scripts/dice-renderer.js
          test -s _site/scripts/inventory-view.js
          grep -q 'app-config.js?v=0.30.1' _site/index.html
          grep -q 'dice-renderer.js?v=0.30.1' _site/index.html
          grep -q 'inventory-view.js?v=0.30.1' _site/index.html
          grep -q "cairn-mobile-sheet-v0.30.1" _site/service-worker.js

      - name: Run browser regression suite
        id: browser_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee playwright-output.log

      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: |
            playwright-output.log
            test-results
            playwright-report
          if-no-files-found: warn

      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-screenshots
          path: ui-review-screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when browser regression suite fails
        if: steps.browser_tests.outcome == 'failure'
        run: exit 1
