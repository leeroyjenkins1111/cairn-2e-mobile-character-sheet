name: Repair Pages deployment

on:
  push:
    branches: [fix/pages-deployment-and-version]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-deployment-and-version
      - name: Repair versioning, site artifact and deployment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('scripts/app.js')
          text = app.read_text()
          text = text.replace("const APP_VERSION = '0.23.0';", "const APP_VERSION = '0.30.0';")
          app.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('<script src="./scripts/app.js"></script>', '<script src="./scripts/app.js?v=0.30.0"></script>')
          text = text.replace('./scripts/dice-face-v4.js?v=0.29.0', './scripts/dice-face-v4.js?v=0.30.0')
          index.write_text(text)

          prepare = Path('scripts/prepare-site.mjs')
          text = prepare.read_text()
          text = text.replace("  'scripts/dice-feedback.js',", "  'scripts/dice-feedback.js',\n  'scripts/dice-face-v4.js',")
          prepare.write_text(text)

          sw = Path('service-worker.js')
          text = sw.read_text()
          text = text.replace("const CACHE_NAME = 'cairn-mobile-sheet-v0.29.0';\nconst COMPATIBILITY_CACHE = 'cairn-mobile-sheet-v0.23.0';", "const CACHE_NAME = 'cairn-mobile-sheet-v0.30.0';")
          text = text.replace("'./scripts/app.js'", "'./scripts/app.js?v=0.30.0'")
          text = text.replace("'./scripts/dice-face-v4.js?v=0.29.0'", "'./scripts/dice-face-v4.js?v=0.30.0'")
          text = text.replace("event.waitUntil(Promise.all([\n    caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)),\n    caches.open(COMPATIBILITY_CACHE).then(cache => cache.add('./assets/forest-background.jpg'))\n  ]).then(() => self.skipWaiting()));", "event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)).then(() => self.skipWaiting()));")
          text = text.replace("keys.filter(key => key.startsWith('cairn-mobile-sheet-') && key !== CACHE_NAME && key !== COMPATIBILITY_CACHE)", "keys.filter(key => key.startsWith('cairn-mobile-sheet-') && key !== CACHE_NAME)")
          sw.write_text(text)

          deploy = Path('.github/workflows/deploy-pages.yml')
          deploy.write_text('''name: Deploy GitHub Pages\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci\n      - name: Build static site\n        run: node scripts/prepare-site.mjs _site\n      - name: Verify deployed renderer and version\n        run: |\n          test -s _site/scripts/dice-face-v4.js\n          grep -q "APP_VERSION = '0.30.0'" _site/scripts/app.js\n          grep -q "dice-face-v4.js?v=0.30.0" _site/index.html\n      - uses: actions/configure-pages@v5\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: _site\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n''')
          PY

          sha256sum index.html manifest.webmanifest service-worker.js icon.svg styles/app.css styles/ux-direct-editing.css scripts/app.js scripts/dice-motion.js scripts/dice-face-v4.js scripts/dice-feedback.js scripts/ux-direct-editing.js scripts/typography-system.js > checksums.sha256
          rm .github/workflows/fix-pages-deployment.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "fix: deploy current build and expose version 0.30.0"
          git push origin HEAD:fix/pages-deployment-and-version
