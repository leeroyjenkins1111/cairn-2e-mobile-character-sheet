name: Patch runtime config

on:
  push:
    branches: [refactor/source-modules-and-tests]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-config-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-modules-and-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-runtime-config.mjs
      - name: Commit runtime config migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/app-core.js
          git diff --cached --quiet && exit 0
          git commit -m "Use runtime config as version source [runtime-config-patched]"
          git push origin HEAD:refactor/source-modules-and-tests
