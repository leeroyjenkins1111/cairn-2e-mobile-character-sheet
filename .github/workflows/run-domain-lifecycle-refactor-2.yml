name: Run domain lifecycle refactor 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'refactor/domain-lifecycle-docs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Execute corrected migration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-domain-lifecycle-refactor.yml').read_text(encoding='utf-8')
          script = workflow.split("python3 <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(script), {'__name__': '__main__'})
          path = Path('scripts/domain-rules.js')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace("\\'use strict\\';", "'use strict';", 1), encoding='utf-8')
          PY
      - name: Restore workflow files
        run: git checkout HEAD -- .github
      - name: Validate implementation
        run: |
          npm run check:syntax
          npm run test:unit
          npm run check:version
          npm run check:production
          npx playwright test tests/persistence-lifecycle.spec.js
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md index.html service-worker.js scripts styles tests
          git commit -m "Wyodrębnij reguły domenowe i testy cyklu danych"
          git push origin HEAD:${{ github.head_ref }}
