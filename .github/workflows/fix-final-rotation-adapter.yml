name: Fix final rotation adapter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/runtime-registry-and-entrypoint' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add final rotation adapter
        run: |
          python3 <<'PY'
          from pathlib import Path

          core_path = Path('scripts/app-core.js')
          core = core_path.read_text(encoding='utf-8')
          old = """function finalDieRotation(sides, value) {
            return { x: 0.5 + (Number(value) % 4) * 0.17, y: 0.65 + (Number(value) % 7) * 0.11, z: -0.12 + (Number(sides) % 5) * 0.045 };
          }
          """
          new = """function finalDieRotationBase(sides, value) {
            return { x: 0.5 + (Number(value) % 4) * 0.17, y: 0.65 + (Number(value) % 7) * 0.11, z: -0.12 + (Number(sides) % 5) * 0.045 };
          }

          function finalDieRotation(sides, value) {
            const adapter = globalThis.CairnDiceRenderer?.getAdapter?.('finalDieRotation');
            return adapter ? adapter(sides, value, finalDieRotationBase) : finalDieRotationBase(sides, value);
          }
          """
          if core.count(old) != 1:
            raise SystemExit('finalDieRotation base block not found exactly once')
          core_path.write_text(core.replace(old, new, 1), encoding='utf-8')

          motion_path = Path('scripts/dice-motion.js')
          motion = motion_path.read_text(encoding='utf-8')
          old = """globalThis.CairnDiceRenderer = Object.freeze({
            register(adapters) {
          """
          new = """globalThis.CairnDiceRenderer = Object.freeze({
            getAdapter(name) {
              return physicalDiceAdapters[name] || null;
            },
            register(adapters) {
          """
          if motion.count(old) != 1:
            raise SystemExit('CairnDiceRenderer registry block not found exactly once')
          motion_path.write_text(motion.replace(old, new, 1), encoding='utf-8')

          renderer_path = Path('scripts/dice-renderer.js')
          renderer = renderer_path.read_text(encoding='utf-8')
          old = """globalThis.CairnDiceRenderer.register({
            physicalAdvanceSpin: advanceAndLockResult,
          """
          new = """globalThis.CairnDiceRenderer.register({
            finalDieRotation: sides => ({ ...heroRotation(sides) }),
            physicalAdvanceSpin: advanceAndLockResult,
          """
          if renderer.count(old) != 1:
            raise SystemExit('dice renderer registration block not found exactly once')
          renderer_path.write_text(renderer.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/unit/source-architecture.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          old = """  assert.match(diceRenderer, /CairnDiceRenderer\.register/);
          });
          """
          new = """  assert.match(diceRenderer, /CairnDiceRenderer\.register/);
            assert.match(core, /getAdapter\?\.\('finalDieRotation'\)/);
            assert.match(diceRenderer, /finalDieRotation:\s*sides/);
          });
          """
          if tests.count(old) != 1:
            raise SystemExit('architecture assertion block not found exactly once')
          test_path.write_text(tests.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Restore workflow files
        run: git checkout HEAD -- .github
      - name: Validate
        run: |
          npm run check:syntax
          npm run test:unit
          npm run check:version
          npm run check:production
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Domknij adapter orientacji kości"
          git push origin HEAD:${{ github.head_ref }}
