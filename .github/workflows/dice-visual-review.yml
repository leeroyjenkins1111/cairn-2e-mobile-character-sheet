name: Dice visual review

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'fix/smooth-physical-dice-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture final material and motion phases
        shell: bash
        run: |
          cat > tests/dice-visual-review.spec.js <<'EOF'
          import { test } from '@playwright/test';
          import fs from 'node:fs/promises';

          test.use({ viewport: { width: 390, height: 844 } });

          test('capture isolated die', async ({ page }) => {
            await fs.mkdir('dice-visual-review', { recursive: true });
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('/');
            await page.waitForFunction(() => document.documentElement.dataset.physicalDice === 'true');
            await page.evaluate(() => {
              document.documentElement.dataset.theme = 'dark';
              document.body.innerHTML = '<main id="review-host"></main>';
              const host = document.querySelector('#review-host');
              Object.assign(host.style, {
                width: '390px', height: '360px', display: 'grid', placeItems: 'center',
                background: 'radial-gradient(circle at 50% 35%, #302235 0, #171019 70%)',
                overflow: 'hidden'
              });
              const panel = document.createElement('div');
              Object.assign(panel.style, { width: '360px', height: '290px', display: 'grid', placeItems: 'center' });
              host.append(panel);
              animateDiceResult(panel, 2, 'Obrażenia', 6, 'success', 'Twin daggers');
            });
            await page.locator('#review-host').screenshot({ path: 'dice-visual-review/00-final-material.png' });

            await page.emulateMedia({ reducedMotion: 'no-preference' });
            await page.evaluate(() => {
              document.documentElement.dataset.reduceMotion = 'false';
              const panel = document.querySelector('#review-host > div');
              animateDiceResult(panel, 5, 'Wynik', 6, 'neutral', 'Rzut testowy');
            });
            for (const [delay, name] of [[180, '01-entry'], [650, '02-roll'], [1230, '03-wall'], [1600, '04-rebound'], [2180, '05-settle']]) {
              await page.waitForTimeout(delay - (globalThis.__lastDelay || 0));
              globalThis.__lastDelay = delay;
              await page.locator('#review-host').screenshot({ path: `dice-visual-review/${name}.png` });
            }
          });
          EOF
          npx playwright test tests/dice-visual-review.spec.js --project=chromium-mobile --reporter=line
          rm tests/dice-visual-review.spec.js
      - uses: actions/upload-artifact@v4
        with:
          name: dice-visual-review
          path: dice-visual-review
          retention-days: 14
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/dice-visual-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/dice-visual-review.yml
          git commit -m "chore: remove temporary dice visual review"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
