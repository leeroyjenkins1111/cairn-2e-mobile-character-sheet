name: Apply mossy dice appearance

on:
  push:
    branches: [fix/mossy-dice-appearance]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mossy-dice-appearance

      - name: Update dice appearance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/dice-motion.js')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  `.result-die-notation { bottom: 1px; color: var(--text-faint); font-size: .58rem; letter-spacing: .05em; opacity: .72; text-shadow: none; }`,",
                  "  `.result-die-notation { display: none !important; }`,"
              ),
              (
                  "  `.dual-dice-result .damage-die-winner .result-die-notation { color: var(--text-soft); }`,\n",
                  ""
              ),
              (
                  "  context.strokeStyle = isLight ? 'rgba(255, 247, 225, .34)' : 'rgba(244, 225, 187, .24)';",
                  "  context.strokeStyle = 'rgba(20, 31, 18, .78)';"
              ),
              (
                  "  context.fillStyle = isLight ? 'rgba(54, 35, 24, .94)' : 'rgba(42, 29, 21, .95)';",
                  "  context.fillStyle = 'rgba(255, 255, 255, .98)';"
              ),
              (
                  "paintResultDie = function paintResultDieAsCarvedBone(canvas, sides, rotation, lift = 0) {",
                  "paintResultDie = function paintResultDieAsMossyStone(canvas, sides, rotation, lift = 0) {"
              ),
              (
                  "    const baseLightness = isLight ? 58 + brightness * 20 : 43 + brightness * 21;\n"
                  "    gradient.addColorStop(0, `hsl(39 29% ${Math.min(83, baseLightness + 6)}%)`);\n"
                  "    gradient.addColorStop(0.58, `hsl(38 27% ${baseLightness}%)`);\n"
                  "    gradient.addColorStop(1, `hsl(35 25% ${Math.max(31, baseLightness - 8)}%)`);",
                  "    const baseLightness = isLight ? 38 + brightness * 20 : 28 + brightness * 23;\n"
                  "    gradient.addColorStop(0, `hsl(88 30% ${Math.min(64, baseLightness + 7)}%)`);\n"
                  "    gradient.addColorStop(0.58, `hsl(93 27% ${baseLightness}%)`);\n"
                  "    gradient.addColorStop(1, `hsl(82 31% ${Math.max(21, baseLightness - 8)}%)`);"
              ),
              (
                  "    drawDieFaceTexture(context, entry.points, entry.faceIndex, brightness);\n",
                  ""
              ),
              (
                  "    context.strokeStyle = isLight ? 'rgba(78, 51, 31, .78)' : 'rgba(58, 39, 27, .88)';",
                  "    context.strokeStyle = isLight ? 'rgba(32, 48, 27, .82)' : 'rgba(18, 31, 20, .92)';"
              ),
              (
                  "    context.strokeStyle = 'rgba(255, 241, 207, .28)';",
                  "    context.strokeStyle = 'rgba(224, 237, 207, .24)';"
              )
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Missing expected source fragment: {old[:90]!r}')
              source = source.replace(old, new, 1)

          source, count = re.subn(
              r"\nfunction drawDieFaceTexture\(context, points, faceIndex, brightness\) \{.*?\n\}\n\nfunction drawDieFaceValue",
              "\nfunction drawDieFaceValue",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected to remove one face texture function, removed {count}')

          path.write_text(source, encoding='utf-8')

          index = Path('index.html')
          index_source = index.read_text(encoding='utf-8')
          if 'dice-motion.js?v=0.23.5' not in index_source:
              raise SystemExit('Expected dice-motion asset version 0.23.5 in index.html')
          index.write_text(index_source.replace('dice-motion.js?v=0.23.5', 'dice-motion.js?v=0.23.6'), encoding='utf-8')

          worker = Path('service-worker.js')
          worker_source = worker.read_text(encoding='utf-8')
          if "cairn-mobile-sheet-v0.23.5" not in worker_source or 'dice-motion.js?v=0.23.5' not in worker_source:
              raise SystemExit('Expected PWA cache version 0.23.5')
          worker_source = worker_source.replace("cairn-mobile-sheet-v0.23.5", "cairn-mobile-sheet-v0.23.6")
          worker_source = worker_source.replace('dice-motion.js?v=0.23.5', 'dice-motion.js?v=0.23.6')
          worker.write_text(worker_source, encoding='utf-8')
          PY

          node --check scripts/dice-motion.js
          node --check service-worker.js

          sha256sum \
            index.html \
            manifest.webmanifest \
            service-worker.js \
            icon.svg \
            styles/app.css \
            styles/ux-direct-editing.css \
            scripts/app.js \
            scripts/dice-motion.js \
            scripts/ux-direct-editing.js \
            scripts/typography-system.js \
            assets/forest-background.jpg > checksums.sha256

          rm .github/workflows/apply-mossy-dice.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/dice-motion.js index.html service-worker.js checksums.sha256 .github/workflows/apply-mossy-dice.yml
          git commit -m 'Refine mossy green dice appearance'
          git push origin HEAD:fix/mossy-dice-appearance
