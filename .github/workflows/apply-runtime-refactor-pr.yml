name: Apply runtime refactor on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'refactor/runtime-registry-and-entrypoint' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute migration script
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-runtime-refactor.yml').read_text(encoding='utf-8')
          script = workflow.split("python3 <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(script), {'__name__': '__main__'})
          Path('.github/workflows/apply-runtime-refactor-pr.yml').unlink()
          PY
      - name: Validate
        run: |
          npm run check:syntax
          npm run test:unit
          npm run check:version
          npm run check:production
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Skonsoliduj rejestry runtime i punkt wejścia"
          git push origin HEAD:${{ github.head_ref }}
