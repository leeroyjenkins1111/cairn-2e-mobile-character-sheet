name: Finalize dice renderer v4

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/dice-renderer-v4-stable-face'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dice-renderer-v4-stable-face
          fetch-depth: 0

      - name: Replace v3 with the stable v4 renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          index = Path('index.html')
          text = index.read_text()
          text, count = re.subn(
              r'<script src="\./scripts/dice-face-v3\.js\?v=[^"]+"></script>',
              '<script src="./scripts/dice-face-v4.js?v=0.29.0"></script>',
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one dice-face-v3 script reference, found {count}')
          index.write_text(text)

          worker = Path('service-worker.js')
          text = worker.read_text()
          text = re.sub(r"const CACHE_NAME = 'cairn-mobile-sheet-v[^']+';", "const CACHE_NAME = 'cairn-mobile-sheet-v0.29.0';", text, count=1)
          text, count = re.subn(
              r"'\./scripts/dice-face-v3\.js\?v=[^']+'",
              "'./scripts/dice-face-v4.js?v=0.29.0'",
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one cached dice-face-v3 asset, found {count}')
          worker.write_text(text)

          Path('scripts/dice-face-v3.js').unlink(missing_ok=True)
          Path('tests/dice-face-v3.spec.js').unlink(missing_ok=True)

          manifest = Path('checksums.sha256')
          paths = []
          for line in manifest.read_text().splitlines():
              if not line.strip():
                  continue
              path = line.split(maxsplit=1)[1]
              if path == 'scripts/dice-face-v3.js':
                  path = 'scripts/dice-face-v4.js'
              if path not in paths:
                  paths.append(path)
          if 'scripts/dice-face-v4.js' not in paths:
              insert_at = paths.index('scripts/dice-motion.js') + 1
              paths.insert(insert_at, 'scripts/dice-face-v4.js')
          lines = []
          for path in paths:
              data = Path(path).read_bytes()
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {path}')
          manifest.write_text('\n'.join(lines) + '\n')
          PY

          node --check scripts/dice-face-v4.js
          node --check service-worker.js
          sha256sum -c checksums.sha256
          rm .github/workflows/finalize-dice-v4.yml

      - name: Commit finalized integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize stable dice renderer v4"
          git push origin HEAD:fix/dice-renderer-v4-stable-face
