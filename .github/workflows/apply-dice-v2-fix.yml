name: Apply corrected smooth dice overhaul

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/smooth-physical-dice-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run corrected generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-dice-v2.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          for duplicate_marker in (
              "function physicalHash(seed) {'''",
              "function drawPhysicalFaceValue'''",
              "paintResultDie = function paintPhysicalMossDie'''",
              "function physicalEntry'''",
              "function physicalInitialSpin'''",
              "function physicalNotation'''",
              "function physicalSetDualComparison'''",
          ):
              script = script.replace(duplicate_marker, "'''")
          exec(compile(script, 'dice-v2-generator.py', 'exec'), {})
          PY
          rm .github/workflows/apply-dice-v2.yml .github/workflows/apply-dice-v2-fix.yml
          sha256sum index.html manifest.webmanifest service-worker.js icon.svg styles/app.css styles/ux-direct-editing.css scripts/app.js scripts/dice-motion.js scripts/dice-feedback.js scripts/ux-direct-editing.js scripts/typography-system.js scripts/character-redesign.js scripts/screen-unification.js scripts/inventory-spacing.js styles/character-redesign.css styles/screen-unification.css assets/forest-background.jpg > checksums.sha256
          node --check scripts/dice-motion.js
          node --check service-worker.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/dice-motion.js tests/dice-motion.spec.js index.html service-worker.js checksums.sha256 .github/workflows/apply-dice-v2.yml .github/workflows/apply-dice-v2-fix.yml
          git commit -m "fix: couple dice rotation to travel and refine material"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
