name: Final refined dice v3 review

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'fix/visible-dice-face-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh manifest and validate focused renderer
        shell: bash
        run: |
          node --check scripts/dice-face-v3.js
          node --check service-worker.js
          sha256sum index.html manifest.webmanifest service-worker.js icon.svg styles/app.css styles/ux-direct-editing.css scripts/app.js scripts/dice-motion.js scripts/dice-face-v3.js scripts/dice-feedback.js scripts/ux-direct-editing.js scripts/typography-system.js scripts/character-redesign.js scripts/screen-unification.js scripts/inventory-spacing.js styles/character-redesign.css styles/screen-unification.css assets/forest-background.jpg > checksums.sha256
          npx playwright test tests/dice-face-v3.spec.js --project=chromium-mobile --reporter=line
      - uses: actions/upload-artifact@v4
        with:
          name: refined-dice-v3-visual-review
          path: ui-review-screenshots/03-dice-face-v3.png
          retention-days: 14
      - name: Commit final manifest and remove review workflow
        shell: bash
        run: |
          rm .github/workflows/final-dice-v3-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: finalize refined dice v3 renderer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
