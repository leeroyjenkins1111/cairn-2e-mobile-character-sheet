name: Debug dice checksums

on:
  push:
    branches: [feat/dice-roll-trajectory-collision]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Print actual and expected checksums
        shell: bash
        run: |
          mkdir repo
          cd repo
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
          sha256sum scripts/app.js > /tmp/app-actual
          grep '  scripts/app.js$' checksums.sha256 > /tmp/app-expected
          echo "ACTUAL BYTES"
          od -An -tx1 /tmp/app-actual
          echo "EXPECTED BYTES"
          od -An -tx1 /tmp/app-expected
          echo "BYTE COMPARISON"
          cmp -l /tmp/app-actual /tmp/app-expected || true
          echo "ISOLATED VERIFY"
          sha256sum -c /tmp/app-expected || true
          echo "FULL VERIFY"
          sha256sum -c checksums.sha256 || true