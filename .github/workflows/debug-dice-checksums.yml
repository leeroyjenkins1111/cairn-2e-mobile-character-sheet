name: Debug dice checksums

on:
  push:
    branches: [feat/dice-roll-trajectory-collision]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Print actual and expected checksums
        shell: bash
        run: |
          mkdir repo
          cd repo
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
          echo "ACTUAL"
          sha256sum index.html service-worker.js scripts/dice-motion.js
          echo "EXPECTED"
          grep -E 'index.html|service-worker.js|scripts/dice-motion.js' checksums.sha256
          echo "VERIFY"
          sha256sum -c checksums.sha256