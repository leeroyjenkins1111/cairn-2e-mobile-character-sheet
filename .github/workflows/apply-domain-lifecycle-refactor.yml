name: Apply domain lifecycle refactor

on:
  push:
    branches: [refactor/domain-lifecycle-docs]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/domain-lifecycle-docs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Apply consolidated refactor
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          domain = r'''\'use strict\';

          (() => {
            const DAMAGE_DIE_SIDES = Object.freeze([4, 6, 8, 10, 12]);
            const MAX_DAMAGE_DICE = 4;

            const toInt = (value, fallback = 0) => {
              const parsed = Number.parseInt(value, 10);
              return Number.isFinite(parsed) ? parsed : fallback;
            };
            const trimText = (value, fallback = '') => typeof value === 'string' ? value.trim() : fallback;
            const safeArray = value => Array.isArray(value) ? value : [];

            function parseDamageFormulaNotation(notation, blast = false) {
              const normalized = trimText(notation).toLowerCase().replace(/\s+/g, '');
              if (!normalized) return null;
              const pattern = /^d(?:4|6|8|10|12)(?:\+d(?:4|6|8|10|12)){0,3}$/;
              if (!pattern.test(normalized)) return null;
              const dice = normalized.split('+').map(token => toInt(token.slice(1), 0));
              return { dice, keep: dice.length > 1 ? 'highest' : 'sum', blast: Boolean(blast) };
            }

            function normalizeDamageFormula(value, fallbackBlast = false) {
              if (!value) return null;
              if (typeof value === 'string') return parseDamageFormulaNotation(value, fallbackBlast);
              if (typeof value !== 'object' || Array.isArray(value)) return null;
              const dice = safeArray(value.dice).map(side => toInt(side, 0));
              if (!dice.length || dice.length > MAX_DAMAGE_DICE || dice.some(side => !DAMAGE_DIE_SIDES.includes(side))) return null;
              return { dice, keep: dice.length === 1 ? 'sum' : 'highest', blast: Boolean(value.blast ?? fallbackBlast) };
            }

            function formatDamageFormula(formula) {
              const normalized = normalizeDamageFormula(formula);
              return normalized ? normalized.dice.map(side => `d${side}`).join('+') : '';
            }

            function isDamageFormulaTag(value) {
              return Boolean(parseDamageFormulaNotation(String(value || '')));
            }

            function rollDamageFormula(formula, roller) {
              const normalized = normalizeDamageFormula(formula);
              if (!normalized) throw new Error('Nieprawidłowa formuła obrażeń.');
              if (typeof roller !== 'function') throw new TypeError('Roller must be a function.');
              const rolls = normalized.dice.map((sides, index) => {
                const value = toInt(roller(sides, index), 0);
                if (value < 1 || value > sides) throw new Error(`Nieprawidłowy wynik k${sides}.`);
                return { sides, value };
              });
              const values = rolls.map(entry => entry.value);
              const total = normalized.keep === 'highest' ? Math.max(...values) : values.reduce((sum, value) => sum + value, 0);
              return { formula: normalized, notation: formatDamageFormula(normalized), rolls, total };
            }

            globalThis.CairnDomainRules = Object.freeze({
              parseDamageFormulaNotation,
              normalizeDamageFormula,
              formatDamageFormula,
              isDamageFormulaTag,
              rollDamageFormula
            });
          })();
          '''
          write('scripts/domain-rules.js', domain)

          core = read('scripts/app-core.js')
          start = core.index('function parseDamageFormulaNotation(')
          end_marker = '\n\n\nfunction parseAttackDiceList('
          end = core.index(end_marker, start)
          replacement = '''const {
            parseDamageFormulaNotation,
            normalizeDamageFormula,
            formatDamageFormula,
            isDamageFormulaTag,
            rollDamageFormula: rollDamageFormulaWith
          } = globalThis.CairnDomainRules || {};

          if (typeof parseDamageFormulaNotation !== 'function') {
            throw new Error('CairnDomainRules must be loaded before app-core.js.');
          }

          function rollDamageFormula(formula, roller = rollDie) {
            return rollDamageFormulaWith(formula, roller);
          }
          '''
          core = core[:start] + replacement + core[end:]
          write('scripts/app-core.js', core)

          index = read('index.html')
          index = replace_once(
              index,
              '  <link rel="stylesheet" href="./styles/runtime-overrides.css?v=0.30.1">',
              '  <link rel="stylesheet" href="./styles/runtime-overrides.css?v=0.30.1">\n  <link rel="stylesheet" href="./styles/dice-runtime.css?v=0.30.1">',
              'dice stylesheet link'
          )
          index = replace_once(
              index,
              '  <script src="./scripts/app-config.js?v=0.30.1"></script>\n  <script src="./scripts/app-core.js?v=0.30.1"></script>',
              '  <script src="./scripts/app-config.js?v=0.30.1"></script>\n  <script src="./scripts/domain-rules.js?v=0.30.1"></script>\n  <script src="./scripts/app-core.js?v=0.30.1"></script>',
              'domain script link'
          )
          write('index.html', index)

          overrides = read('styles/runtime-overrides.css')
          marker = '/* Physical dice layout — static replacement for runtime insertRule. */'
          if overrides.count(marker) != 1:
              raise SystemExit('physical dice CSS marker not found exactly once')
          before, after = overrides.split(marker, 1)
          write('styles/runtime-overrides.css', before.rstrip() + '\n')
          write('styles/dice-runtime.css', '''/* Physical dice presentation and motion layout.\n   Kept separate from emergency runtime overrides so the ownership of dice styles is explicit. */\n\n''' + after.lstrip())

          prepare = read('scripts/prepare-site.mjs')
          prepare = replace_once(prepare, "  'styles/runtime-overrides.css',", "  'styles/runtime-overrides.css',\n  'styles/dice-runtime.css',", 'dice CSS build copy')
          prepare = replace_once(prepare, "  'scripts/app-config.js',", "  'scripts/app-config.js',\n  'scripts/domain-rules.js',", 'domain build copy')
          write('scripts/prepare-site.mjs', prepare)

          worker = read('service-worker.js')
          worker = replace_once(worker, "'./styles/runtime-overrides.css?v=0.30.1'", "'./styles/runtime-overrides.css?v=0.30.1', './styles/dice-runtime.css?v=0.30.1'", 'dice CSS cache')
          worker = replace_once(worker, "'./scripts/app-config.js?v=0.30.1'", "'./scripts/app-config.js?v=0.30.1', './scripts/domain-rules.js?v=0.30.1'", 'domain cache')
          write('service-worker.js', worker)

          unit = r'''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import vm from 'node:vm';

          async function loadRules() {
            const source = await readFile(new URL('../../scripts/domain-rules.js', import.meta.url), 'utf8');
            const context = vm.createContext({});
            vm.runInContext(source, context, { filename: 'domain-rules.js' });
            return context.CairnDomainRules;
          }

          test('parses and normalizes Cairn damage notation', async () => {
            const rules = await loadRules();
            assert.deepEqual({ ...rules.parseDamageFormulaNotation(' d6 + d8 ') }, { dice: [6, 8], keep: 'highest', blast: false });
            assert.deepEqual({ ...rules.normalizeDamageFormula({ dice: ['12'], blast: true }) }, { dice: [12], keep: 'sum', blast: true });
            assert.equal(rules.parseDamageFormulaNotation('d20'), null);
            assert.equal(rules.normalizeDamageFormula({ dice: [6, 20] }), null);
          });

          test('formats formulas and recognizes damage tags', async () => {
            const rules = await loadRules();
            assert.equal(rules.formatDamageFormula({ dice: [4, 10] }), 'd4+d10');
            assert.equal(rules.isDamageFormulaTag('d12'), true);
            assert.equal(rules.isDamageFormulaTag('blast'), false);
          });

          test('rolls a single die as sum and multiple dice as highest', async () => {
            const rules = await loadRules();
            const single = rules.rollDamageFormula('d6', () => 4);
            assert.equal(single.total, 4);
            assert.equal(single.notation, 'd6');

            const values = [2, 7, 5];
            const multiple = rules.rollDamageFormula('d6+d8+d10', (_sides, index) => values[index]);
            assert.equal(multiple.total, 7);
            assert.deepEqual(Array.from(multiple.rolls, entry => ({ ...entry })), [
              { sides: 6, value: 2 },
              { sides: 8, value: 7 },
              { sides: 10, value: 5 }
            ]);
          });

          test('rejects invalid roller output', async () => {
            const rules = await loadRules();
            assert.throws(() => rules.rollDamageFormula('d4', () => 5), /Nieprawidłowy wynik k4/);
            assert.throws(() => rules.rollDamageFormula('d6', null), /Roller must be a function/);
          });
          '''
          write('tests/unit/domain-rules.test.mjs', unit)

          e2e = r'''import { expect, test } from '@playwright/test';

          const STORAGE_KEY = 'cairn-mobile-sheet:state';
          const CHECKPOINTS_KEY = 'cairn-mobile-sheet:checkpoints';

          async function loadDemo(page) {
            await page.goto('/');
            await page.getByRole('button', { name: 'Tryb demonstracyjny' }).click();
            await page.getByRole('button', { name: 'Wczytaj demo' }).click();
            await expect.poll(() => page.evaluate(key => JSON.parse(localStorage.getItem(key) || '{}').initialized, STORAGE_KEY)).toBe(true);
          }

          async function renameCharacter(page, name) {
            await page.getByRole('button', { name: 'Dziennik' }).click();
            await page.getByRole('button', { name: 'Edytuj dane' }).click();
            await page.getByLabel('Imię').fill(name);
            await page.getByRole('button', { name: 'Zapisz dane podstawowe' }).click();
            await expect.poll(() => page.evaluate(key => JSON.parse(localStorage.getItem(key) || '{}').identity?.name, STORAGE_KEY)).toBe(name);
          }

          test.beforeEach(async ({ page }) => {
            await page.goto('/');
            await page.evaluate(() => localStorage.clear());
          });

          test('persists an edited character across a full reload', async ({ page }) => {
            await loadDemo(page);
            await renameCharacter(page, 'Mira z Głębokiego Lasu');

            await page.reload();

            await expect(page.getByText('Mira z Głębokiego Lasu', { exact: true }).first()).toBeVisible();
            const persisted = await page.evaluate(key => JSON.parse(localStorage.getItem(key) || '{}'), STORAGE_KEY);
            expect(persisted.identity.name).toBe('Mira z Głębokiego Lasu');
            expect(persisted.initialized).toBe(true);
          });

          test('exports, imports and checkpoints the replaced character through the UI', async ({ page }) => {
            await loadDemo(page);
            const originalName = await page.evaluate(key => JSON.parse(localStorage.getItem(key) || '{}').identity.name, STORAGE_KEY);

            const downloadPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: 'Pobierz pełną kopię' }).first().click();
            const download = await downloadPromise;
            const backupPath = await download.path();
            expect(backupPath).toBeTruthy();

            await renameCharacter(page, 'Postać przed importem');
            await page.locator('#backupFileInput').setInputFiles(backupPath);
            await expect(page.getByRole('heading', { name: 'Raport importu' })).toBeVisible();
            await page.getByRole('button', { name: 'Nadpisz kartę importem' }).click();
            await page.getByRole('button', { name: 'Nadpisz kartę', exact: true }).click();

            await expect.poll(() => page.evaluate(key => JSON.parse(localStorage.getItem(key) || '{}').identity?.name, STORAGE_KEY)).toBe(originalName);
            const checkpoints = await page.evaluate(key => JSON.parse(localStorage.getItem(key) || '[]'), CHECKPOINTS_KEY);
            expect(checkpoints).toHaveLength(1);
            expect(checkpoints[0].payload.identity.name).toBe('Postać przed importem');
            expect(checkpoints[0].reason).toContain('Przed importem');
          });
          '''
          write('tests/persistence-lifecycle.spec.js', e2e)

          architecture_path = Path('tests/unit/source-architecture.test.mjs')
          architecture = architecture_path.read_text(encoding='utf-8')
          insertion = """

          test('domain rules and owned dice styles are explicit production assets', async () => {
            const [index, worker, prepare, core, rules, diceCss, overrides] = await Promise.all([
              readFile('index.html', 'utf8'),
              readFile('service-worker.js', 'utf8'),
              readFile('scripts/prepare-site.mjs', 'utf8'),
              readFile('scripts/app-core.js', 'utf8'),
              readFile('scripts/domain-rules.js', 'utf8'),
              readFile('styles/dice-runtime.css', 'utf8'),
              readFile('styles/runtime-overrides.css', 'utf8')
            ]);
            assert.match(index, /scripts\\/domain-rules\\.js/);
            assert.match(index, /styles\\/dice-runtime\\.css/);
            assert.match(worker, /domain-rules\\.js/);
            assert.match(worker, /dice-runtime\\.css/);
            assert.match(prepare, /domain-rules\\.js/);
            assert.match(prepare, /dice-runtime\\.css/);
            assert.match(core, /CairnDomainRules/);
            assert.match(rules, /rollDamageFormula/);
            assert.match(diceCss, /Physical dice presentation/);
            assert.doesNotMatch(overrides, /Physical dice layout/);
          });
          """
          architecture_path.write_text(architecture.rstrip() + insertion + '\n', encoding='utf-8')

          check_path = Path('scripts/check-production-runtime.mjs')
          check = check_path.read_text(encoding='utf-8')
          check = check.replace("  readFile('_site/scripts/app-bootstrap.js', 'utf8'),", "  readFile('_site/scripts/app-bootstrap.js', 'utf8'),\n  readFile('_site/scripts/domain-rules.js', 'utf8'),\n  readFile('_site/styles/dice-runtime.css', 'utf8'),")
          check = check.replace('const [index, core, bootstrap, entry, worker]', 'const [index, core, bootstrap, domainRules, diceRuntimeCss, entry, worker]')
          check = check.replace("  [index.includes('scripts/app-entry.js?v='), 'index loads app-entry.js'],", "  [index.includes('scripts/app-entry.js?v='), 'index loads app-entry.js'],\n  [index.includes('scripts/domain-rules.js?v='), 'index loads domain-rules.js'],\n  [index.includes('styles/dice-runtime.css?v='), 'index loads dice-runtime.css'],\n  [domainRules.includes('globalThis.CairnDomainRules'), 'domain rules expose their runtime API'],\n  [diceRuntimeCss.includes('Physical dice presentation'), 'dice runtime CSS is present'],")
          check_path.write_text(check, encoding='utf-8')

          readme = '''# Cairn 2e Mobile Character Sheet

          Mobilna, lokalna karta jednej postaci do Cairn 2e. Aplikacja działa bez konta i backendu. Stan postaci, punkty odzyskiwania i metadane kopii pozostają w pamięci przeglądarki użytkownika.

          ## Aplikacja

          https://leeroyjenkins1111.github.io/cairn-2e-mobile-character-sheet/

          ## Najważniejsze funkcje

          - OCHR, SIŁ, ZRE, WOL, pancerz, złoto, stany i Blizny;
          - obrażenia rozliczane w kolejności pancerz → OCHR → SIŁ;
          - ekwipunek z limitem miejsc, zmęczeniem, użyciami i stanem noszenia;
          - rzuty obronne, Kość Losu, ataki, podmuch i wiele kości obrażeń;
          - import JSON Kettlewright oraz pełne kopie zapasowe aplikacji;
          - trzy lokalne punkty odzyskiwania tworzone przed operacjami destrukcyjnymi;
          - log sesji, historia zmian, Undo i eksport raportów;
          - PWA działające offline po pierwszym poprawnym otwarciu;
          - obsługa klawiatury, reduced motion, wysokiego kontrastu i jasnego/ciemnego motywu.

          ## Dane i kompatybilność

          Główny stan jest zapisywany w `localStorage` pod kluczem `cairn-mobile-sheet:state`. Punkty odzyskiwania używają osobnego klucza `cairn-mobile-sheet:checkpoints`. Wyczyszczenie danych witryny usuwa oba zbiory, dlatego lokalne checkpointy nie zastępują pobranej kopii JSON.

          Aktualny format ma `schemaVersion: 3`. Aplikacja migruje starsze wspierane formaty podczas wczytywania, a import pełnej kopii najpierw zabezpiecza bieżącą kartę jako checkpoint.

          ## Architektura runtime

          Projekt pozostaje aplikacją vanilla JavaScript bez frameworka, bundlera, zewnętrznych fontów i zależności sieciowych.

          - `index.html` — semantyczny shell, cztery widoki, tab bar, bottom sheet i jawna kolejność assetów;
          - `scripts/app-config.js` — wersja aplikacji udostępniana runtime;
          - `scripts/domain-rules.js` — czyste reguły domenowe możliwe do testowania bez DOM;
          - `scripts/app-core.js` — model stanu, logika aplikacyjna, bazowe renderowanie i kontrolery operacji;
          - `scripts/app-bootstrap.js` — wiązanie zdarzeń i definicja inicjalizacji;
          - `scripts/app-entry.js` — jedyny punkt uruchamiający `initialize()` po rejestracji rozszerzeń;
          - `scripts/render-hooks.js` oraz wyspecjalizowane skrypty — rejestracja rendererów, hooków i adapterów;
          - `styles/app.css` — bazowy layout i system wizualny;
          - `styles/character-redesign.css` oraz `styles/screen-unification.css` — warstwy ekranów;
          - `styles/dice-runtime.css` — należące do modułu kości style prezentacji i ruchu;
          - `styles/runtime-overrides.css` — małe, przekrojowe korekty runtime, które nie mają własnego właściciela;
          - `service-worker.js` — jawny cache plików wymaganych offline;
          - `scripts/prepare-site.mjs` — budowa statycznego katalogu `_site` przez kopiowanie dozwolonych assetów.

          Kolejność klasycznych skryptów w `index.html` jest częścią kontraktu runtime. `domain-rules.js` musi poprzedzać `app-core.js`, rozszerzenia rejestrują się przed `app-entry.js`, a pierwszy render następuje dopiero na końcu.

          ## Uruchomienie lokalne

          ```bash
          npm ci
          npm run build
          npx playwright install chromium webkit
          npx http-server _site -p 4173
          ```

          Serwer deweloperski używany przez Playwright jest skonfigurowany w `playwright.config.js`; zwykłe `npm test` przygotowuje i testuje `_site` zgodnie z tą konfiguracją.

          ## Testy i walidacja

          ```bash
          npm run check:syntax
          npm run test:unit
          npm run check:version
          npm run check:production
          npm test
          ```

          - testy jednostkowe wykonują rzeczywistą logikę czystych modułów domenowych oraz pilnują kontraktów architektonicznych;
          - Playwright uruchamia regresję na Chromium Mobile i WebKit Mobile;
          - `tests/persistence-lifecycle.spec.js` przechodzi przez zapis po reloadzie, pobranie kopii, import przez input pliku i utworzenie checkpointu;
          - CI publikuje log, trace’y, raport Playwright i screenshoty review jako artefakty diagnostyczne.

          ## Build, CI i publikacja

          `npm run check:production` buduje `_site` i uruchamia wspólną walidację produkcyjnego artefaktu. Ten sam kontrakt jest używany w CI oraz w `.github/workflows/deploy-pages.yml`, dzięki czemu deployment nie ma osobnej listy ręcznych grepów.

          Zmiany scalone do `main` są wdrażane na GitHub Pages po poprawnym zbudowaniu i zweryfikowaniu statycznego artefaktu.
          '''
          write('README.md', '\n'.join(line[10:] if line.startswith('          ') else line for line in readme.splitlines()).strip() + '\n')
          PY
      - name: Restore workflow files
        run: git checkout HEAD -- .github
      - name: Validate implementation
        run: |
          npm run check:syntax
          npm run test:unit
          npm run check:version
          npm run check:production
          npx playwright test tests/persistence-lifecycle.spec.js
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md index.html service-worker.js scripts styles tests
          git commit -m "Wyodrębnij reguły domenowe i testy cyklu danych"
          git push origin HEAD:refactor/domain-lifecycle-docs
