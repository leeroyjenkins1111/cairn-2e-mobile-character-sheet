# Deployment workflow for the standalone Cairn 2e mobile character sheet.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized version
        run: npm run check:version

      - name: Prepare static site
        run: npm run build

      - name: Verify deployed build
        run: |
          node scripts/check-production-runtime.mjs
          test -s _site/assets/forest-background.jpg
          test -s _site/styles/runtime-overrides.css
          test -s _site/scripts/app-core.js
          test -s _site/scripts/app-bootstrap.js
          test -s _site/scripts/app-config.js
          test -s _site/scripts/dice-renderer.js
          test -s _site/scripts/inventory-view.js
          grep -q 'app-core.js?v=0.30.1' _site/index.html
          grep -q 'app-bootstrap.js?v=0.30.1' _site/index.html
          grep -q 'runtime-overrides.css?v=0.30.1' _site/index.html
          grep -q 'dice-renderer.js?v=0.30.1' _site/index.html
          grep -q "cairn-mobile-sheet-v0.30.1" _site/service-worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
