name: Materialize runtime

on:
  push:
    branches: [refactor/source-modules-and-tests]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-modules-and-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/materialize-runtime.mjs
      - name: Commit generated runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/app-core.js scripts/app-bootstrap.js
          git diff --cached --quiet && exit 0
          git commit -m "Materialize source runtime [runtime-materialized]"
          git push origin HEAD:refactor/source-modules-and-tests
