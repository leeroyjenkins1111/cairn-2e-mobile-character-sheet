name: Synchronize version metadata

on:
  push:
    branches: [fix/sync-version-0.30.1]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sync-version-0.30.1
      - name: Synchronize version 0.30.1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '0.30.1'

          app = Path('scripts/app.js')
          text = app.read_text()
          text = text.replace("const APP_VERSION = '0.23.0';", f"const APP_VERSION = '{version}';")
          text = text.replace("const APP_VERSION = '0.30.0';", f"const APP_VERSION = '{version}';")
          app.write_text(text)

          build = Path('scripts/build-info.js')
          text = build.read_text()
          text = text.replace("const BUILD_VERSION = '0.30.0';", f"const BUILD_VERSION = '{version}';")
          build.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('app.js?v=0.30.0', f'app.js?v={version}')
          text = text.replace('dice-face-v4.js?v=0.30.0', f'dice-face-v4.js?v={version}')
          text = text.replace('build-info.js?v=0.30.0', f'build-info.js?v={version}')
          index.write_text(text)

          sw = Path('service-worker.js')
          text = sw.read_text()
          text = text.replace('app.js?v=0.30.0', f'app.js?v={version}')
          text = text.replace('dice-face-v4.js?v=0.30.0', f'dice-face-v4.js?v={version}')
          text = text.replace('build-info.js?v=0.30.0', f'build-info.js?v={version}')
          sw.write_text(text)

          deploy = Path('.github/workflows/deploy-pages.yml')
          text = deploy.read_text()
          text = text.replace("dice-face-v4.js?v=0.30.0", f"dice-face-v4.js?v={version}")
          text = text.replace("build-info.js?v=0.30.0", f"build-info.js?v={version}")
          marker = "          grep -q 'build-info.js?v=0.30.1' _site/index.html\n"
          checks = (
              "          grep -q \"APP_VERSION = '0.30.1'\" _site/scripts/app.js\n"
              "          grep -q \"BUILD_VERSION = '0.30.1'\" _site/scripts/build-info.js\n"
          )
          if checks.strip() not in text:
              text = text.replace(marker, marker + checks)
          deploy.write_text(text)

          check = Path('scripts/check-version-sync.mjs')
          check.write_text('''import { readFile } from 'node:fs/promises';\n\nconst expected = '0.30.1';\nconst files = {\n  app: await readFile('scripts/app.js', 'utf8'),\n  build: await readFile('scripts/build-info.js', 'utf8'),\n  index: await readFile('index.html', 'utf8'),\n  worker: await readFile('service-worker.js', 'utf8')\n};\n\nconst assertions = [\n  [files.app.includes(`APP_VERSION = '${expected}'`), 'scripts/app.js APP_VERSION'],\n  [files.build.includes(`BUILD_VERSION = '${expected}'`), 'scripts/build-info.js BUILD_VERSION'],\n  [files.index.includes(`app.js?v=${expected}`), 'index app.js version'],\n  [files.index.includes(`dice-face-v4.js?v=${expected}`), 'index dice-face-v4 version'],\n  [files.index.includes(`dice-premium.js?v=${expected}`), 'index dice-premium version'],\n  [files.index.includes(`build-info.js?v=${expected}`), 'index build-info version'],\n  [files.worker.includes(`cairn-mobile-sheet-v${expected}`), 'service worker cache version'],\n  [files.worker.includes(`app.js?v=${expected}`), 'service worker app.js version'],\n  [files.worker.includes(`dice-face-v4.js?v=${expected}`), 'service worker dice-face-v4 version'],\n  [files.worker.includes(`dice-premium.js?v=${expected}`), 'service worker dice-premium version'],\n  [files.worker.includes(`build-info.js?v=${expected}`), 'service worker build-info version']\n];\n\nconst failures = assertions.filter(([pass]) => !pass).map(([, label]) => label);\nif (failures.length) {\n  console.error(`Version ${expected} is not synchronized: ${failures.join(', ')}`);\n  process.exit(1);\n}\nconsole.log(`Version ${expected} is synchronized across runtime, assets and PWA cache.`);\n''')

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          anchor = "      - name: Check application JavaScript syntax\n        run: node --check scripts/app.js\n"
          addition = anchor + "\n      - name: Verify synchronized application version\n        run: node scripts/check-version-sync.mjs\n"
          if 'Verify synchronized application version' not in text:
              text = text.replace(anchor, addition)
          ci.write_text(text)

          Path('.github/workflows/sync-version-fix.yml').unlink()
          PY
      - name: Commit synchronized version
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "fix: synchronize application version 0.30.1"
          git push origin HEAD:fix/sync-version-0.30.1
