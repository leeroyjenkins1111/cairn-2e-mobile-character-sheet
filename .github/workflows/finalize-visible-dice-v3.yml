name: Finalize visible dice face v3

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/visible-dice-face-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace the subtle v2 overlay with the visible v3 renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('  <script src="./scripts/dice-face-v2.js?v=0.27.0"></script>\n', '')
          marker = '  <script src="./scripts/inventory-spacing.js?v=0.25.2"></script>'
          replacement = marker + '\n  <script src="./scripts/dice-face-v3.js?v=0.28.0"></script>'
          if marker not in html or 'dice-face-v3.js' in html:
              raise SystemExit('Unexpected index.html script state')
          index.write_text(html.replace(marker, replacement, 1))

          worker = Path('service-worker.js')
          source = worker.read_text()
          source = source.replace("cairn-mobile-sheet-v0.27.0", "cairn-mobile-sheet-v0.28.0")
          source = source.replace("./scripts/dice-face-v2.js?v=0.27.0", "./scripts/dice-face-v3.js?v=0.28.0")
          if 'dice-face-v2.js' in source or 'dice-face-v3.js?v=0.28.0' not in source:
              raise SystemExit('Unexpected service-worker asset state')
          worker.write_text(source)

          test = Path('tests/dice-face-v3.spec.js')
          test.write_text(r'''import { test, expect } from '@playwright/test';

          test.describe('visible dice result face v3', () => {
            test.beforeEach(async ({ page }) => {
              await page.goto('/');
              await page.waitForFunction(() => document.documentElement.dataset.diceFaceV3 === 'true');
            });

            test('freezes a more front-facing k6 result before reveal', async ({ page }) => {
              const result = await page.evaluate(() => {
                const target = finalDieRotation(6);
                const entry = { sides: 6, seed: 42, finalRotation: target };
                const spin = physicalInitialSpin(entry, 1);
                physicalAdvanceSpin(spin, target, 1 / 60, 0.87, { x: 20, y: 0 });
                const first = { ...spin.rotation };
                physicalAdvanceSpin(spin, target, 1 / 60, 0.98, { x: 24, y: 0 });
                return { target, first, second: { ...spin.rotation } };
              });

              expect(Math.abs(result.target.z)).toBeLessThan(0.001);
              expect(Math.abs(result.target.x)).toBeLessThan(0.25);
              expect(Math.abs(result.target.y)).toBeLessThan(0.30);
              expect(result.first.x).toBeCloseTo(result.target.x, 5);
              expect(result.first.y).toBeCloseTo(result.target.y, 5);
              expect(result.first.z).toBeCloseTo(result.target.z, 5);
              expect(result.second).toEqual(result.first);
            });

            test('captures the final carved k6 face for visual review', async ({ page }) => {
              await page.emulateMedia({ reducedMotion: 'reduce' });
              await page.reload();
              await page.waitForFunction(() => document.documentElement.dataset.diceFaceV3 === 'true');
              await page.evaluate(() => {
                const host = document.createElement('div');
                host.id = 'dice-v3-review';
                host.style.width = '360px';
                host.style.padding = '20px';
                host.style.background = '#211322';
                document.body.replaceChildren(host);
                animateDiceResult(host, 4, 'Wynik', 6, 'neutral');
              });
              const review = page.locator('#dice-v3-review');
              await expect(review.locator('.result-die-canvas')).toHaveCount(1);
              await review.screenshot({ path: 'ui-review-screenshots/03-dice-face-v3.png' });
            });
          });
          '''.replace('          ', ''))
          PY

          rm -f scripts/dice-face-v2.js tests/dice-face-v2.spec.js .github/workflows/finalize-visible-dice-v3.yml
          node --check scripts/dice-face-v3.js
          node --check service-worker.js
          sha256sum index.html manifest.webmanifest service-worker.js icon.svg styles/app.css styles/ux-direct-editing.css scripts/app.js scripts/dice-motion.js scripts/dice-face-v3.js scripts/dice-feedback.js scripts/ux-direct-editing.js scripts/typography-system.js scripts/character-redesign.js scripts/screen-unification.js scripts/inventory-spacing.js styles/character-redesign.css styles/screen-unification.css assets/forest-background.jpg > checksums.sha256

      - name: Commit final renderer integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: replace subtle dice face overlay with visible v3 renderer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
