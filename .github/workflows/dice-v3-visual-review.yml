name: Dice v3 visual review

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'fix/visible-dice-face-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run focused renderer tests
        run: npx playwright test tests/dice-face-v3.spec.js --project=chromium-mobile --reporter=line
      - uses: actions/upload-artifact@v4
        with:
          name: dice-v3-visual-review
          path: ui-review-screenshots/03-dice-face-v3.png
          retention-days: 14
      - name: Remove temporary review workflow
        shell: bash
        run: |
          rm .github/workflows/dice-v3-visual-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove temporary dice v3 review workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
