name: Apply runtime refactor

on:
  push:
    branches: [refactor/runtime-registry-and-entrypoint]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-registry-and-entrypoint
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          core = read('scripts/app-core.js')
          registry = """

          const runtimeRenderers = {
            character: null,
            inventory: null,
            combatLauncher: null
          };
          const characterRenderHooks = new Set();

          function registerRuntimeRenderer(name, renderer) {
            if (!Object.prototype.hasOwnProperty.call(runtimeRenderers, name)) throw new Error(`Unknown runtime renderer: ${name}`);
            if (typeof renderer !== 'function') throw new TypeError(`Runtime renderer ${name} must be a function.`);
            if (runtimeRenderers[name]) throw new Error(`Runtime renderer ${name} is already registered.`);
            runtimeRenderers[name] = renderer;
            return () => { if (runtimeRenderers[name] === renderer) runtimeRenderers[name] = null; };
          }

          function addCharacterRenderHook(hook) {
            if (typeof hook !== 'function') throw new TypeError('Character render hook must be a function.');
            characterRenderHooks.add(hook);
            return () => characterRenderHooks.delete(hook);
          }

          function renderCharacterScreen() {
            (runtimeRenderers.character || renderCharacterView)();
            for (const hook of characterRenderHooks) {
              try { hook(); }
              catch (error) { console.error('Character render hook failed.', error); }
            }
          }

          globalThis.CairnRuntime = Object.freeze({
            registerRenderer: registerRuntimeRenderer,
            addCharacterHook: addCharacterRenderHook
          });
          """
          core = replace_once(core, "const APP_ID = 'cairn-mobile-sheet';", "const APP_ID = 'cairn-mobile-sheet';" + registry, 'runtime registry')
          core = core.replace("if (activeView === 'character') renderCharacterView();", "if (activeView === 'character') renderCharacterScreen();")
          core = core.replace("if (activeView === 'inventory') renderInventoryView();", "if (activeView === 'inventory') (runtimeRenderers.inventory || renderInventoryView)();")
          core = replace_once(core, "  renderCharacterView();\n  renderInventoryView();", "  renderCharacterScreen();\n  (runtimeRenderers.inventory || renderInventoryView)();", 'renderAll dispatch')
          core = replace_once(core, "sessionLayout.append(renderCombatLauncher());", "sessionLayout.append((runtimeRenderers.combatLauncher || renderCombatLauncher)());", 'combat dispatch')
          write('scripts/app-core.js', core)

          hooks = """'use strict';

          (() => {
            if (!globalThis.CairnRuntime) throw new Error('CairnRuntime must be loaded before render-hooks.js.');
            globalThis.CairnRenderHooks = Object.freeze({
              addCharacterHook: globalThis.CairnRuntime.addCharacterHook
            });
          })();
          """
          write('scripts/render-hooks.js', hooks)

          redesign = read('scripts/character-redesign.js')
          redesign = replace_once(redesign, '  renderCombatLauncher = function renderCombatLauncherRedesigned() {', '  function renderCombatLauncherRedesigned() {', 'combat renderer declaration')
          redesign = replace_once(redesign, "  function enhanceCharacterCopy() {", "  globalThis.CairnRuntime.registerRenderer('combatLauncher', renderCombatLauncherRedesigned);\n\n  function enhanceCharacterCopy() {", 'combat renderer registration')
          redesign = redesign.replace("  renderAll();\n", "")
          write('scripts/character-redesign.js', redesign)

          inventory = read('scripts/inventory-view.js')
          inventory = replace_once(inventory, '  renderInventoryView = function renderConsolidatedInventoryView() {', '  function renderConsolidatedInventoryView() {', 'inventory renderer declaration')
          inventory = replace_once(inventory, '  renderInventoryView();\n', "  globalThis.CairnRuntime.registerRenderer('inventory', renderConsolidatedInventoryView);\n", 'inventory renderer registration')
          write('scripts/inventory-view.js', inventory)

          bootstrap = read('scripts/app-bootstrap.js')
          bootstrap = re.sub(r'\ninitialize\(\);\s*$', '\n', bootstrap)
          write('scripts/app-bootstrap.js', bootstrap)

          entry = """'use strict';

          if (typeof initialize !== 'function') throw new Error('Application bootstrap is unavailable.');
          initialize();
          """
          write('scripts/app-entry.js', entry)

          index = read('index.html')
          index = replace_once(index, '  <script src="./scripts/dice-renderer.js?v=0.30.1"></script>', '  <script src="./scripts/dice-renderer.js?v=0.30.1"></script>\n  <script src="./scripts/app-entry.js?v=0.30.1"></script>', 'entry script')
          write('index.html', index)

          prepare = read('scripts/prepare-site.mjs')
          prepare = replace_once(prepare, "  'scripts/app-bootstrap.js',", "  'scripts/app-bootstrap.js',\n  'scripts/app-entry.js',", 'entry build copy')
          write('scripts/prepare-site.mjs', prepare)

          worker = read('service-worker.js')
          worker = replace_once(worker, "'./scripts/dice-renderer.js?v=0.30.1'", "'./scripts/dice-renderer.js?v=0.30.1', './scripts/app-entry.js?v=0.30.1'", 'entry cache')
          write('service-worker.js', worker)

          motion = read('scripts/dice-motion.js')
          match = re.search(r"const PHYSICAL_DICE_RULES = \[(.*?)\];\n\nfunction installPhysicalDiceStyles\(\) \{.*?\n\}\n", motion, re.S)
          if not match:
              raise SystemExit('physical dice dynamic styles block not found')
          rules = re.findall(r'`(.*?)`', match.group(1), re.S)
          motion = motion[:match.start()] + motion[match.end():]
          motion = motion.replace('installPhysicalDiceStyles();\n', '')

          adapter_header = """
          const physicalDiceAdapters = Object.create(null);
          globalThis.CairnDiceRenderer = Object.freeze({
            register(adapters) {
              if (!adapters || typeof adapters !== 'object') throw new TypeError('Dice renderer adapters must be an object.');
              for (const [name, adapter] of Object.entries(adapters)) {
                if (typeof adapter !== 'function') throw new TypeError(`Dice renderer adapter ${name} must be a function.`);
                if (physicalDiceAdapters[name]) throw new Error(`Dice renderer adapter ${name} is already registered.`);
                physicalDiceAdapters[name] = adapter;
              }
            }
          });
          """
          motion = replace_once(motion, "const baseCreateDieMesh = createDieMesh;", "const baseCreateDieMesh = createDieMesh;" + adapter_header, 'dice adapter registry')

          adapter_functions = [
            ('drawPhysicalTexture', 'context, entry, sides, isLight, canvas'),
            ('drawPhysicalFaceValue', 'context, entry, label, reveal'),
            ('physicalPaintEntry', 'entry, rotation, lift = 0'),
            ('physicalAdvanceSpin', 'spin, finalRotation, deltaSeconds, progress, pose')
          ]
          for name, signature in adapter_functions:
              motion = replace_once(motion, f'function {name}({signature}) {{', f'function {name}Base({signature}) {{', f'{name} base rename')
              marker = f'function {name}Base({signature}) {{'
              wrapper = f"function {name}({signature}) {{\n  const adapter = physicalDiceAdapters.{name};\n  return adapter ? adapter({', '.join(part.split(' = ')[0] for part in signature.split(', '))}, {name}Base) : {name}Base({', '.join(part.split(' = ')[0] for part in signature.split(', '))});\n}}\n\n"
              motion = replace_once(motion, marker, wrapper + marker, f'{name} wrapper')
          write('scripts/dice-motion.js', motion)

          renderer = read('scripts/dice-renderer.js')
          renderer = re.sub(r"\n  if \(typeof finalDieRotation === 'function'\) \{.*?\n  \}\n", '\n', renderer, count=1, flags=re.S)
          renderer = renderer.replace("  if (typeof physicalAdvanceSpin === 'function') {\n    const advanceSpin = physicalAdvanceSpin;\n    physicalAdvanceSpin = function advanceAndLockResult(spin, finalRotation, deltaSeconds, progress, pose) {", "  function advanceAndLockResult(spin, finalRotation, deltaSeconds, progress, pose, advanceSpin) {")
          renderer = renderer.replace("    };\n  }\n\n  if (typeof physicalPaintEntry === 'function') {\n    const paintEntry = physicalPaintEntry;\n    physicalPaintEntry = function paintStableResult(entry, rotation, lift = 0) {", "  }\n\n  function paintStableResult(entry, rotation, lift = 0, paintEntry) {")
          renderer = renderer.replace("    };\n  }\n\n  function drawPremiumStone", "  }\n\n  function drawPremiumStone", 1)
          renderer = renderer.replace("  if (typeof drawPhysicalTexture === 'function') {\n    const baseTexture = drawPhysicalTexture;\n    drawPhysicalTexture = function drawConsolidatedStone(context, face, sides, isLight, canvas) {", "  function drawConsolidatedStone(context, face, sides, isLight, canvas, baseTexture) {")
          renderer = renderer.replace("    };\n  }\n\n  function localFaceAngle", "  }\n\n  function localFaceAngle", 1)
          renderer = renderer.replace("  if (typeof drawPhysicalFaceValue === 'function') {\n    drawPhysicalFaceValue = function drawConsolidatedFaceValue(context, face, label, reveal) {", "  function drawConsolidatedFaceValue(context, face, label, reveal) {")
          renderer = renderer.replace("    };\n  }\n\n  const style = document.createElement('style');", "  }\n\n  const style = document.createElement('style');", 1)
          renderer = re.sub(r"\n  const style = document\.createElement\('style'\);.*?document\.head\.append\(style\);", '', renderer, count=1, flags=re.S)
          registration = """
          globalThis.CairnDiceRenderer.register({
            physicalAdvanceSpin: advanceAndLockResult,
            physicalPaintEntry: paintStableResult,
            drawPhysicalTexture: drawConsolidatedStone,
            drawPhysicalFaceValue: drawConsolidatedFaceValue
          });
          """
          renderer = replace_once(renderer, "  document.documentElement.dataset.diceRenderer = 'consolidated';", registration + "\n  document.documentElement.dataset.diceRenderer = 'consolidated';", 'dice adapter registration')
          write('scripts/dice-renderer.js', renderer)

          css = read('styles/runtime-overrides.css').rstrip() + '\n\n/* Physical dice layout — static replacement for runtime insertRule. */\n' + '\n'.join(rules) + '\n'
          write('styles/runtime-overrides.css', css)

          check = read('scripts/check-production-runtime.mjs')
          check = replace_once(check, "  readFile('_site/scripts/app-bootstrap.js', 'utf8'),", "  readFile('_site/scripts/app-bootstrap.js', 'utf8'),", 'check bootstrap marker')
          check = check.replace("const [index, core, bootstrap, worker]", "const [index, core, bootstrap, worker]")
          check = check.replace("  [worker.includes('scripts/app-bootstrap.js?v='), 'service worker caches app-bootstrap.js'],", "  [worker.includes('scripts/app-bootstrap.js?v='), 'service worker caches app-bootstrap.js'],\n  [index.includes('scripts/app-entry.js?v='), 'index loads app-entry.js'],\n  [worker.includes('scripts/app-entry.js?v='), 'service worker caches app-entry.js'],\n  [!bootstrap.trimEnd().endsWith('initialize();'), 'bootstrap does not initialize itself'],")
          check = check.replace("  [!productionSource.includes('Testy deweloperskie'), 'developer settings row excluded'],", "  [!productionSource.includes('Testy deweloperskie'), 'developer settings row excluded'],\n  [!productionSource.includes('renderCharacterView = function'), 'character renderer is not monkey patched'],\n  [!productionSource.includes('document.createElement(\'style\')'), 'runtime does not create style elements'],\n  [!productionSource.includes('insertRule'), 'runtime does not insert CSS rules'],")
          write('scripts/check-production-runtime.mjs', check)

          unit = read('tests/unit/source-architecture.test.mjs')
          unit = unit.replace("const [index, core, bootstrap, worker, directEditing, characterRedesign]", "const [index, core, bootstrap, worker, directEditing, characterRedesign, renderHooks, diceMotion, diceRenderer]")
          unit = unit.replace("  readFile('scripts/character-redesign.js', 'utf8')\n]);", "  readFile('scripts/character-redesign.js', 'utf8'),\n  readFile('scripts/render-hooks.js', 'utf8'),\n  readFile('scripts/dice-motion.js', 'utf8'),\n  readFile('scripts/dice-renderer.js', 'utf8')\n]);")
          unit += """

          test('runtime inicjalizuje się przez końcowy entrypoint', async () => {
            const entry = await readFile('scripts/app-entry.js', 'utf8');
            assert.doesNotMatch(bootstrap, /initialize\(\);\s*$/);
            assert.match(entry, /initialize\(\);/);
            assert.match(index, /scripts\/app-entry\.js\?v=/);
            assert.match(worker, /scripts\/app-entry\.js\?v=/);
          });

          test('renderery używają jawnych rejestrów zamiast globalnych nadpisań', () => {
            assert.match(core, /registerRuntimeRenderer/);
            assert.doesNotMatch(renderHooks, /renderCharacterView\s*=/);
            assert.doesNotMatch(characterRedesign, /renderCombatLauncher\s*=/);
            assert.match(characterRedesign, /registerRenderer\('combatLauncher'/);
            assert.match(diceMotion, /CairnDiceRenderer/);
            assert.match(diceRenderer, /CairnDiceRenderer\.register/);
          });

          test('runtime nie tworzy ani nie wstrzykuje arkuszy CSS', () => {
            const runtime = [core, bootstrap, directEditing, characterRedesign, renderHooks, diceMotion, diceRenderer].join('\n');
            assert.doesNotMatch(runtime, /insertRule|document\.createElement\(['\"]style['\"]\)|style\.textContent/);
          });
          """
          write('tests/unit/source-architecture.test.mjs', unit)

          for workflow in ['.github/workflows/ci.yml', '.github/workflows/deploy-pages.yml']:
              text = read(workflow)
              text = re.sub(r"\n\s+test -s _site/.*?(?=\n\s+- name:|\n\s+uses:|\Z)", '', text, count=1, flags=re.S)
              write(workflow, text)

          Path('.github/workflows/apply-runtime-refactor.yml').unlink()
          PY
      - name: Validate
        run: |
          npm run check:syntax
          npm run test:unit
          npm run check:version
          npm run check:production
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Skonsoliduj rejestry runtime i punkt wejścia"
          git push origin HEAD:refactor/runtime-registry-and-entrypoint
